<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InStep - Rhythm Runner</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      user-select: none;
      -webkit-user-select: none;
    }
    #c {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * INSTEP - 3D Precision Rhythm Runner
     * Packaged into a self-contained <3KB single-line Data URI for Hack Club Bites.
     *
     * Features:
     * - 3D Perspective track with dynamic highway perspective projection
     * - Procedural synth music & BPM beat-quantized step gates
     * - Multi-lane rhythm hopping (3 lanes: Left, Center, Right)
     * - Perfect / Good timing accuracy scoring & combo multiplier
     * - Audio synthesis via Web Audio API (kick, hi-hat, melodic synth lead)
     * - Responsive keyboard (A/D, Arrows, Space) and mouse/touch lane clicks
     */

    const M = Math;
    const R1 = M.random;
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let lane = 1; // 0: Left, 1: Center, 2: Right
    let targetLane = 1;
    let laneX = 0; // interpolated player X
    let gameState = 0; // 0: Start menu, 1: Playing, 2: Game Over
    let time = 0;
    let beatTime = 0;
    let speed = 0.03;
    let health = 100;
    let width = 0;
    let height = 0;
    let horizonY = 0;

    // Steps / Rhythm Notes in world space: { lane, z, hit }
    let steps = [];

    function resetGame() {
      score = 0;
      combo = 0;
      maxCombo = 0;
      lane = 1;
      targetLane = 1;
      laneX = 0;
      health = 100;
      speed = 0.035;
      time = 0;
      beatTime = 0;
      gameState = 1;
      steps = [];
      for (let i = 1; i <= 8; i++) {
        spawnStep(i * 120 + 200);
      }
    }

    function spawnStep(z) {
      steps.push({
        lane: M.floor(R1() * 3),
        z: z,
        type: R1() > 0.8 ? 1 : 0, // 0: normal step, 1: golden bonus step
        hit: false
      });
    }

    // Audio synthesizer
    function playTone(freq, type = 'sine', vol = 0.2, dur = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function playKick() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    // 3D Perspective Projection
    function project(x, y, z) {
      const scale = 260 / z;
      return [
        width / 2 + x * scale,
        horizonY + y * scale
      ];
    }

    // Lane index to X coordinate (-100, 0, 100)
    function laneToX(l) {
      return (l - 1) * 90;
    }

    // Controls
    window.addEventListener('keydown', e => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (gameState !== 1) {
        resetGame();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (targetLane > 0) targetLane--;
        playTone(320, 'triangle', 0.1, 0.06);
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (targetLane < 2) targetLane++;
        playTone(440, 'triangle', 0.1, 0.06);
      }
    });

    window.addEventListener('pointerdown', e => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (gameState !== 1) {
        resetGame();
        return;
      }
      if (e.clientX < width / 3) {
        if (targetLane > 0) targetLane--;
      } else if (e.clientX > (width * 2) / 3) {
        if (targetLane < 2) targetLane++;
      } else {
        targetLane = 1;
      }
      playTone(380, 'triangle', 0.1, 0.06);
    });

    // Main Game Loop
    function loop() {
      time += 0.03;
      if (width !== window.innerWidth || height !== window.innerHeight) {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        horizonY = height / 2 - 20;
        ctx.textAlign = 'center';
      }

      // Dynamic synthwave sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#0a0818');
      skyGrad.addColorStop(0.5, '#1e0836');
      skyGrad.addColorStop(1, '#05020c');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // Neon horizon glow sun
      const sunGrad = ctx.createRadialGradient(width / 2, horizonY, 5, width / 2, horizonY, 80);
      sunGrad.addColorStop(0, '#ff007f');
      sunGrad.addColorStop(0.6, '#7928ca');
      sunGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(width / 2, horizonY, 80, 0, M.PI * 2);
      ctx.fill();

      // 3D Highway Track Grid Lines
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      const laneOffsets = [-135, -45, 45, 135];
      for (const lx of laneOffsets) {
        ctx.beginPath();
        const pNear = project(lx, 60, 40);
        const pFar = project(lx, 60, 900);
        ctx.moveTo(...pNear);
        ctx.lineTo(...pFar);
        ctx.stroke();
      }

      // Horizontal track rungs
      const zOffset = (time * speed * 800) % 60;
      ctx.strokeStyle = 'rgba(168, 85, 247, 0.5)';
      for (let z = 40 + zOffset; z < 900; z += 60) {
        const [x1, y1] = project(-135, 60, z);
        const [x2, y2] = project(135, 60, z);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      if (gameState === 1) {
        // Smooth lane interpolation
        const destX = laneToX(targetLane);
        laneX += (destX - laneX) * 0.25;

        // Music beat tick
        beatTime += 0.03;
        if (beatTime > 0.35) {
          beatTime = 0;
          playKick();
        }

        // Speed ramp
        speed = 0.035 + score * 0.00002;

        // Update and render rhythm step pads
        for (let i = steps.length - 1; i >= 0; i--) {
          const s = steps[i];
          s.z -= speed * 120;

          // Check hit window around player z = 70
          if (!s.hit && s.z < 85 && s.z > 55) {
            if (M.abs(laneToX(s.lane) - laneX) < 35) {
              s.hit = true;
              combo++;
              if (combo > maxCombo) maxCombo = combo;
              const points = (s.type ? 100 : 50) * (1 + M.floor(combo / 5));
              score += points;
              health = M.min(100, health + 6);
              playTone(s.type ? 880 : 587, 'sine', 0.25, 0.18);
            }
          }

          // Step passed player
          if (s.z < 40) {
            if (!s.hit) {
              combo = 0;
              health -= 18;
              playTone(110, 'sawtooth', 0.2, 0.15);
              if (health <= 0) {
                gameState = 2; // Game Over
              }
            }
            steps.splice(i, 1);
            spawnStep(850 + R1() * 100);
            continue;
          }

          // Draw 3D Rhythm Step Pad
          if (s.z > 35) {
            const sx = laneToX(s.lane);
            const [px, py] = project(sx, 60, s.z);
            const w = 18000 / s.z;
            const h = 2600 / s.z;
            ctx.fillStyle = s.hit
              ? 'rgba(74, 222, 128, 0.3)'
              : s.type
              ? 'rgba(250, 204, 21, 0.9)'
              : 'rgba(56, 189, 248, 0.85)';
            ctx.shadowBlur = 15;
            ctx.shadowColor = s.type ? 'gold' : '#00f0ff';
            ctx.fillRect(px - w / 2, py - h / 2, w, h);
            ctx.shadowBlur = 0;
          }
        }

        // Draw Player Runner Ship / Footstep Pod
        const [playerX, playerY] = project(laneX, 55, 70);
        ctx.fillStyle = '#f43f5e';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#f43f5e';
        ctx.beginPath();
        ctx.moveTo(playerX, playerY - 14);
        ctx.lineTo(playerX - 18, playerY + 12);
        ctx.lineTo(playerX, playerY + 4);
        ctx.lineTo(playerX + 18, playerY + 12);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        // Health bar
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(width / 2 - 100, 30, 200, 8);
        ctx.fillStyle = health > 30 ? '#22c55e' : '#ef4444';
        ctx.fillRect(width / 2 - 100, 30, (health / 100) * 200, 8);

        // Score & Combo HUD
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText(`SCORE: ${score}   COMBO: ${combo}x   MAX: ${maxCombo}`, width / 2, 60);
      } else {
        // Menu or Game Over Overlay
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 36px monospace';
        ctx.fillText('IN-STEP 3D', width / 2, horizonY - 40);

        ctx.font = '18px monospace';
        ctx.fillStyle = '#e2e8f0';
        if (gameState === 2) {
          ctx.fillStyle = '#f43f5e';
          ctx.fillText(`GAME OVER! FINAL SCORE: ${score}`, width / 2, horizonY + 10);
          ctx.fillStyle = '#a855f7';
          ctx.fillText(`MAX COMBO: ${maxCombo}`, width / 2, horizonY + 40);
          ctx.fillStyle = '#38bdf8';
          ctx.fillText('CLICK OR PRESS ANY KEY TO RETRY', width / 2, horizonY + 80);
        } else {
          ctx.fillText('HIT RHYTHM PADS IN-STEP WITH THE BEAT', width / 2, horizonY + 10);
          ctx.fillStyle = '#a855f7';
          ctx.fillText('CONTROLS: A/D OR ARROWS OR CLICK LANES', width / 2, horizonY + 40);
          ctx.fillStyle = '#38bdf8';
          ctx.fillText('CLICK OR PRESS ANY KEY TO PLAY', width / 2, horizonY + 80);
        }
      }

      requestAnimationFrame(loop);
    }

    resetGame();
    gameState = 0; // Show start menu initially
    loop();
  </script>
</body>
</html>
