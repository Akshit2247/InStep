<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InStep - Wobbly Ragdoll Stair Climber</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      user-select: none;
      -webkit-user-select: none;
    }
    #c {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    // InStep - Wobbly ragdoll stair climbing game
    // Control your left leg (Q / A / Left Click) and right leg (E / D / Right Click).
    // Reach as high up the endless staircase as you can without tumbling backward!

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    let score = 0;
    let highScore = 0;
    let gameOver = false;
    let gameStarted = false;
    let wobble = 0;

    // Ragdoll character state
    let bodyX = 200;
    let bodyY = 300;
    let bodyVx = 0;
    let bodyVy = 0;
    let tilt = 0;
    let tiltVel = 0;

    // Leg angles & positions
    let leftLegAngle = 0.2;
    let rightLegAngle = -0.2;
    let leftLegTarget = 0.2;
    let rightLegTarget = -0.2;
    let leftGrounded = true;
    let rightGrounded = false;
    let stepCount = 0;

    // Sound effect generator
    function playBeep(freq, type = 'sine', duration = 0.1, vol = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function resetGame() {
      bodyX = 180;
      bodyY = 320;
      bodyVx = 0;
      bodyVy = 0;
      tilt = 0;
      tiltVel = 0;
      wobble = 0;
      leftLegAngle = 0.2;
      rightLegAngle = -0.2;
      leftLegTarget = 0.2;
      rightLegTarget = -0.2;
      leftGrounded = true;
      rightGrounded = false;
      score = 0;
      stepCount = 0;
      gameOver = false;
      gameStarted = true;
    }

    // Step with left leg
    function stepLeft() {
      if (gameOver) return resetGame();
      if (!gameStarted) return resetGame();
      leftLegTarget = 0.7;
      rightLegTarget = -0.4;
      bodyVx += 2.2;
      bodyVy -= 4.2;
      tiltVel -= 0.08;
      leftGrounded = false;
      rightGrounded = true;
      stepCount++;
      score = Math.max(score, Math.floor(stepCount / 2));
      playBeep(260 + (score % 8) * 35, 'triangle', 0.12, 0.2);
    }

    // Step with right leg
    function stepRight() {
      if (gameOver) return resetGame();
      if (!gameStarted) return resetGame();
      rightLegTarget = 0.7;
      leftLegTarget = -0.4;
      bodyVx += 2.2;
      bodyVy -= 4.2;
      tiltVel += 0.08;
      rightGrounded = false;
      leftGrounded = true;
      stepCount++;
      score = Math.max(score, Math.floor(stepCount / 2));
      playBeep(320 + (score % 8) * 35, 'triangle', 0.12, 0.2);
    }

    // Controls
    window.addEventListener('keydown', e => {
      initAudio();
      if (e.key === 'q' || e.key === 'Q' || e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
        stepLeft();
      } else if (e.key === 'e' || e.key === 'E' || e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') {
        stepRight();
      } else if (e.key === ' ') {
        if (!gameStarted || gameOver) resetGame();
      }
    });

    window.addEventListener('pointerdown', e => {
      initAudio();
      if (!gameStarted || gameOver) {
        resetGame();
        return;
      }
      if (e.clientX < window.innerWidth / 2) {
        stepLeft();
      } else {
        stepRight();
      }
    });

    // Main animation loop
    function loop() {
      const W = canvas.width = window.innerWidth;
      const H = canvas.height = window.innerHeight;

      // Smooth camera scrolling based on player position
      const camX = bodyX - W * 0.35;
      const camY = bodyY - H * 0.55;

      // Draw background
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      // Draw endless 3D isometric/shaded stairs
      const stairWidth = 80;
      const stairHeight = 45;
      const startStair = Math.floor((camX - 200) / stairWidth) - 4;
      const endStair = startStair + Math.ceil(W / stairWidth) + 10;

      for (let i = startStair; i < endStair; i++) {
        const sx = i * stairWidth - camX;
        const sy = H - (i * stairHeight - camY);

        // Stair top
        ctx.fillStyle = i % 2 === 0 ? '#334155' : '#475569';
        ctx.fillRect(sx, sy, stairWidth + 2, 12);

        // Stair riser
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(sx + stairWidth, sy, 20, stairHeight + 4);

        // Step number label
        if (i > 0 && i % 5 === 0) {
          ctx.fillStyle = '#94a3b8';
          ctx.font = '12px monospace';
          ctx.fillText(`Step ${i}`, sx + 10, sy - 8);
        }
      }

      if (gameStarted && !gameOver) {
        // Physics update
        bodyVy += 0.28; // gravity
        bodyVx *= 0.94; // friction
        bodyX += bodyVx;
        bodyY += bodyVy;

        // Ragdoll wobbly physics
        wobble += 0.05;
        tiltVel += (Math.random() - 0.5) * 0.02; // unstable wobbling
        tiltVel -= tilt * 0.04; // upright restoring force
        tiltVel *= 0.92;
        tilt += tiltVel;

        leftLegAngle += (leftLegTarget - leftLegAngle) * 0.2;
        rightLegAngle += (rightLegTarget - rightLegAngle) * 0.2;

        // Ground / Stair collision detection
        const currentStairIndex = Math.floor(bodyX / stairWidth);
        const stairSurfaceY = H - (currentStairIndex * stairHeight);

        if (bodyY + 60 >= stairSurfaceY) {
          bodyY = stairSurfaceY - 60;
          bodyVy = 0;
          tiltVel += (Math.random() - 0.5) * 0.04;
        }

        // Tumbled backward or fell
        if (Math.abs(tilt) > 1.25 || bodyY > stairSurfaceY + 200) {
          gameOver = true;
          if (score > highScore) highScore = score;
          playBeep(120, 'sawtooth', 0.35, 0.25);
        }
      }

      // Render Ragdoll Character
      const px = bodyX - camX;
      const py = bodyY - camY;

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(tilt);

      // Torso
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -30);
      ctx.lineTo(0, 25);
      ctx.stroke();

      // Head
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(0, -42, 14, 0, Math.PI * 2);
      ctx.fill();

      // Cute face
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(4, -44, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Left leg (Blue / Teal)
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-4, 25);
      const lKneeX = Math.sin(leftLegAngle) * 22 - 6;
      const lKneeY = Math.cos(leftLegAngle) * 22 + 25;
      ctx.lineTo(lKneeX, lKneeY);
      ctx.lineTo(lKneeX + Math.sin(leftLegAngle + 0.3) * 20, lKneeY + Math.cos(leftLegAngle + 0.3) * 20);
      ctx.stroke();

      // Right leg (Indigo / Violet)
      ctx.strokeStyle = '#818cf8';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(4, 25);
      const rKneeX = Math.sin(rightLegAngle) * 22 + 6;
      const rKneeY = Math.cos(rightLegAngle) * 22 + 25;
      ctx.lineTo(rKneeX, rKneeY);
      ctx.lineTo(rKneeX + Math.sin(rightLegAngle + 0.3) * 20, rKneeY + Math.cos(rightLegAngle + 0.3) * 20);
      ctx.stroke();

      // Wobbly arms
      ctx.strokeStyle = '#f472b6';
      ctx.lineWidth = 5;
      const armWave = Math.sin(wobble * 3) * 15;
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(-20, armWave);
      ctx.moveTo(0, -18);
      ctx.lineTo(20, -armWave);
      ctx.stroke();

      ctx.restore();

      // HUD / UI
      ctx.textAlign = 'left';
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 20px monospace';
      ctx.fillText(`STAIRS: ${score}`, 24, 40);
      ctx.font = '14px monospace';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`BEST: ${highScore}`, 24, 64);

      // On-screen touch guidance
      if (gameStarted && !gameOver) {
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.font = '13px monospace';
        ctx.fillText('◄ LEFT LEG (A / Click Left)        RIGHT LEG (D / Click Right) ►', W / 2, H - 24);
      }

      // Start / Game Over Screen
      if (!gameStarted || gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 36px monospace';
        ctx.fillText('INSTEP', W / 2, H / 2 - 70);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '18px monospace';
        if (gameOver) {
          ctx.fillStyle = '#f43f5e';
          ctx.fillText(`YOU TUMBLED! FINAL SCORE: ${score}`, W / 2, H / 2 - 20);
          ctx.fillStyle = '#cbd5e1';
          ctx.font = '15px monospace';
          ctx.fillText('CLICK OR PRESS SPACE TO RETRY', W / 2, H / 2 + 25);
        } else {
          ctx.fillText('A wobbly ragdoll stair climbing simulator.', W / 2, H / 2 - 20);
          ctx.fillStyle = '#a855f7';
          ctx.font = '15px monospace';
          ctx.fillText('A / Q: Left Leg  |  D / E: Right Leg  (or Click Left / Right)', W / 2, H / 2 + 15);
          ctx.fillStyle = '#38bdf8';
          ctx.fillText('CLICK OR PRESS ANY KEY TO CLIMB', W / 2, H / 2 + 60);
        }
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
